# mcp-servers-base.yaml — well-known MCP server templates (playbook SSOT base layer).
#
# Consumers merge this with their own `<repo>/mcp-servers.yaml` (project layer) and
# `~/.config/mcp-servers.yaml` (personal layer, overridable via
# $AIPLAYBOOK_PERSONAL_MCP_FILE). Render pipeline = 3-layer merge with precedence
# personal > project > base, field-by-field (deep merge, not wholesale replacement).
#
# Keys are canonical short-form IDs (`hindsight`, `guardrails-mcp`, …). Never
# prefixed with a consumer name. See `specs/mcp-servers-schema.md` for the full
# merge + render contract.
#
# Fields per server entry:
#   id                canonical short-form (must match the map key)
#   description       one-sentence intent, readable by an LLM agent
#   transport         stdio | http
#   endpoint          http URL (only when transport == http)
#   command           stdio launcher command (only when transport == stdio)
#   env:
#     required        [ENV_VAR_NAMES] — render refuses if any is unset at merge time
#     optional        [ENV_VAR_NAMES]
#   auth              none | bearer | oauth | cf-access
#   scope             personal | project | universal
#                     personal-scope servers are rejected outside the personal layer
#   capabilities_hint [short tokens used by router/health checks]

schema: mcp-servers/v1
version: 0.2.0
layer: base

servers:

  hindsight:
    id: hindsight
    description: Episodic memory + semantic recall backing Hermes and every downstream agent.
    transport: http
    endpoint: null  # resolved per-environment in project/personal layer
    command: null
    env:
      required: [HINDSIGHT_API_KEY, HINDSIGHT_URL, HINDSIGHT_BANK_ID]
      optional: [HINDSIGHT_TIMEOUT_MS]
    auth: bearer
    scope: universal
    capabilities_hint: [recall, retain, search, timeline]

  litellm:
    id: litellm
    description: LLM routing + budget + fallback proxy in front of Anthropic/OpenAI/local.
    transport: http
    endpoint: null
    command: null
    env:
      required: [LITELLM_URL, LITELLM_MASTER_KEY]
      optional: [LITELLM_PROJECT, LITELLM_DEFAULT_MODEL]
    auth: bearer
    scope: universal
    capabilities_hint: [completion, routing, fallback]

  guardrails-mcp:
    id: guardrails-mcp
    description: "Prompt-injection + policy filter MCP. Planned — lands in T10 / Phase 5 T26."
    transport: http
    endpoint: null
    command: null
    env:
      required: [GUARDRAILS_URL, GUARDRAILS_API_KEY]
      optional: [GUARDRAILS_POLICY_PROFILE]
    auth: bearer
    scope: universal
    capabilities_hint: [filter, classify, policy]

  atlassian-consumer-a:
    id: atlassian-consumer-a
    description: Jira Cloud tenant (consumer-a.atlassian.net) exposed via Cloudflare Access tunnel.
    transport: http
    endpoint: null
    command: null
    env:
      required: [ATLASSIAN_URL, ATLASSIAN_API_TOKEN]
      optional: [ATLASSIAN_USERNAME, ATLASSIAN_DEFAULT_PROJECT]
    auth: cf-access
    scope: universal
    capabilities_hint: [jira-search, jira-issue, confluence-search]

  # Per-tenant templates below are `scope: universal` at the base layer (templates
  # are universally available). Activating them (setting endpoint + env) is done
  # in the personal layer so OAuth tokens never touch a shared repo.
  google-workspace-arturo:
    id: google-workspace-arturo
    description: Gmail + Drive + Calendar for Arturo's personal Google Workspace tenant.
    transport: http
    endpoint: null
    command: null
    env:
      required: [GOOGLE_ARTURO_OAUTH_TOKEN, GOOGLE_ARTURO_CLIENT_ID]
      optional: [GOOGLE_ARTURO_CLIENT_SECRET, GOOGLE_ARTURO_REFRESH_TOKEN]
    auth: oauth
    scope: universal
    capabilities_hint: [gmail, drive, calendar]

  google-workspace-consumer-b:
    id: google-workspace-consumer-b
    description: Gmail + Drive + Calendar for the consumer-b (restaurant) Google Workspace tenant.
    transport: http
    endpoint: null
    command: null
    env:
      required: [GOOGLE_consumer-b_OAUTH_TOKEN, GOOGLE_consumer-b_CLIENT_ID]
      optional: [GOOGLE_consumer-b_CLIENT_SECRET, GOOGLE_consumer-b_REFRESH_TOKEN]
    auth: oauth
    scope: universal
    capabilities_hint: [gmail, drive, calendar]

  trello-arturo:
    id: trello-arturo
    description: Trello boards under Arturo's personal account (all non-consumer-b boards).
    transport: http
    endpoint: null
    command: null
    env:
      required: [TRELLO_API_KEY, TRELLO_TOKEN]
      optional: [TRELLO_DEFAULT_BOARD_ID]
    auth: bearer
    scope: universal
    capabilities_hint: [trello-card, trello-board, trello-list]

  trello-consumer-b:
    id: trello-consumer-b
    description: Trello board for the consumer-b restaurant operations.
    transport: http
    endpoint: null
    command: null
    env:
      required: [TRELLO_API_KEY, TRELLO_TOKEN]
      optional: [TRELLO_consumer-b_BOARD_ID]
    auth: bearer
    scope: universal
    capabilities_hint: [trello-card, trello-board, trello-list]

  skills-registry:
    id: skills-registry
    description: Central skills discovery + catalog service — agents query it before planning.
    transport: http
    endpoint: null
    command: null
    env:
      required: [SKILLS_REGISTRY_URL]
      optional: [SKILLS_REGISTRY_API_KEY]
    auth: none
    scope: universal
    capabilities_hint: [skills-list, skills-describe, skills-search]

  crm:
    id: crm
    description: Twenty CRM read-only access (contacts, companies, deals).
    transport: http
    endpoint: null
    command: null
    env:
      required: [TWENTY_API_URL, TWENTY_API_KEY]
      optional: [TWENTY_DEFAULT_WORKSPACE]
    auth: bearer
    scope: universal
    capabilities_hint: [crm-contact, crm-company, crm-deal]

  rag:
    id: rag
    description: Local vault + codebase RAG search (Obsidian vault + project source).
    transport: stdio
    endpoint: null
    command: "python -m consumer-d.rag"
    env:
      required: [RAG_VAULT_PATH]
      optional: [RAG_INDEX_PATH, RAG_TOP_K]
    auth: none
    scope: universal
    capabilities_hint: [vault-search, code-search, semantic-search]
