# Pre-commit configuration for ai-playbook itself (dogfooding).
#
# Consumers copy `templates/new-project/.pre-commit-config.yaml.tmpl` — that
# template lives under T14 and references `.ai-playbook/scripts/*`. This file
# runs the same chain against the playbook repo's own files, with script paths
# relative to the repo root (no submodule prefix).
#
# Full hook chain lands in T09. Diagram: docs/concepts/architecture-diagrams.md §3.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses !!python/name:pymdownx... tags for Mermaid
        # superfences; the stock check-yaml hook's safe-loader rejects them.
        # mkdocs itself validates the config; excluding here is safe.
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: schema-validate
        name: schema-validate (AGENTS.md frontmatter)
        entry: python -m scripts.schema_validate
        language: system
        files: ^AGENTS\.md$
        pass_filenames: true

      - id: mcp-validate
        name: mcp-validate (mcp-servers.yaml shape)
        entry: python -m scripts.mcp.validate
        language: system
        files: ^mcp-servers.*\.yaml$
        pass_filenames: true

      - id: block-manual-spec-edit
        name: block-manual-spec-edit (openspec/specs hand-edit guard)
        entry: python -m scripts.block_manual_spec_edit
        language: system
        files: ^openspec/specs/.*\.md$
        pass_filenames: true

      - id: verdict-lint
        name: verdict-lint (QA artefact ✅/⚠️/❓ + S1-S4 shape)
        entry: python -m scripts.verdict_lint --shape artifact
        language: system
        files: ^openspec/changes/.*/(review|reviews/.*|qa/.*|readiness).*\.md$
        pass_filenames: true

      # validate-skills-mirror REMOVED in v0.17.0 (slice
      # single-source-skills-reset). The new single-source materialiser at
      # `scripts/materialise_skills.py` performs a fingerprint-equality
      # short-circuit that obsoletes the drift-detection pre-commit gate.
      # Mirror trees (skills/, .claude/skills/, .gemini/skills/) are now
      # gitignored at consumer side; nothing to drift-check.

      - id: verify-llm-routing
        name: verify-llm-routing (Change C drift detector — direct-SDK callers)
        entry: python -m scripts.verify_llm_routing
        language: system
        pass_filenames: false
        # Warn-only initially per D3.5 — exit 0 even on findings. Promote to
        # strict (exit 2) by setting AIPLAYBOOK_LLM_ROUTING_STRICT=1 or by
        # appending `--strict` to the entry above, after 30 days of green
        # builds (target: 2026-06-05).
        always_run: true

      - id: rules-inventory-check
        name: rules-inventory-check (config-ui/rules-inventory.json fresh + no dangling hooks)
        entry: python -m scripts.rules_toggle inventory --check
        language: system
        # Depends on the SET of rule artifacts on disk, not the staged files —
        # so always_run (a deleted .rule.md wouldn't otherwise trigger it).
        pass_filenames: false
        always_run: true
