# ai-playbook consumers registry — committed, org-level source of truth.
#
# Distinct from `~/.ai-playbook/projects.yaml` (per-dev, gitignored) which
# maps project names to local filesystem paths for dispatcher resolution.
# This file enumerates every downstream repo that consumes the playbook
# as a git submodule, so automation (GitHub Actions, LangGraph workflows)
# can open "bump playbook pin" PRs across the whole inventory when a new
# tag is cut.
#
# Add a consumer: PR against this file.
# Remove a consumer: PR against this file.
# The per-dev projects.yaml continues to hold local paths independently.
#
# Schema
# ------
#   schema: ai-playbook/consumers/v1
#   consumers:
#     <name>:
#       repo: <org>/<name>              # GitHub slug
#       default_branch: master | main   # base for PRs
#       submodule_path: .ai-playbook    # (optional, defaults to .ai-playbook)
#       personal: true | false          # (optional) personal add-on repo
#       visibility: public | private    # (optional, for audit)
#       status: active | paused | archived  # paused = skip automation
#       notes: free text                # (optional)
#       skills_pins:                    # (optional, RFC-0001) per-source-repo
#         <source-repo-slug>: <semver>  # tag pin for skills materialisation.
#                                       # Source slugs match the repo's bare
#                                       # name (e.g. `ai-playbook`,
#                                       # `eligia-skills`). Absence of a key
#                                       # = consumer doesn't pull from that
#                                       # source. propagate_skills_bump.py
#                                       # only opens PRs for consumers that
#                                       # already have a pin for the bumped
#                                       # source.
#       tracker_kind: github | jira     # REQUIRED — the issue-tracker surface
#                                       # this consumer publishes change-tracking
#                                       # tickets on. `github` = the consumer's
#                                       # own GitHub Issues / Projects. `jira` =
#                                       # the explicit jira_project below.
#                                       # No silent fallback: if this is missing
#                                       # for an active consumer, automation
#                                       # fails loudly. Read by issue_sync.py
#                                       # decide_surface() and validated by the
#                                       # consumers-schema CI check.
#       jira_project: <KEY>             # REQUIRED iff tracker_kind == jira.
#                                       # The Jira project key (e.g. TRATTOS).
#                                       # Ignored when tracker_kind == github.
#
# Automation consumers of this file:
#   - .github/workflows/propagate-playbook-bump.yml (event-driven on tag push)
#   - .github/workflows/propagate-skills-bump.yml   (RFC-0001 Phase 2b)
#   - eligia-core/langgraph-aiops/workflows/playbook_bump_propagator.py (daily)
#   - scripts/bump_consumers.py (manual CLI; merges with projects.yaml for
#     resolution of local paths when run interactively)

schema: ai-playbook/consumers/v1
version: 1

consumers:
  openTrattOS:
    repo: Wizarck/openTrattOS
    default_branch: master
    visibility: public
    status: active
    tracker_kind: github
    notes: Community AGPL-3.0 repo. Designed with optional Jira routing for the
      future; currently uses GH issues exclusively. To switch to Jira, set
      tracker_kind=jira and jira_project=<KEY>.
    skills_pins:
      ai-playbook: v0.4.0
      eligia-skills: v0.2.0

  eligia-core:
    repo: Wizarck/eligia-core
    default_branch: master
    visibility: private
    personal: true
    status: active
    tracker_kind: github
    notes: Personal add-on (ELIGIA.md) lives alongside the playbook submodule.
    skills_pins:
      ai-playbook: v0.4.0
      eligia-skills: v0.2.0

  palafito-b2b:
    repo: Wizarck/palafito-b2b
    default_branch: master
    visibility: private
    status: active
    tracker_kind: github
    notes: WordPress + WooCommerce B2B for the Mexican wholesale market. Onboarded 2026-04-25.
    skills_pins:
      ai-playbook: v0.4.0
      eligia-skills: v0.2.0

  iguanatrader:
    repo: Wizarck/iguanatrader
    default_branch: main
    visibility: private
    status: active
    tracker_kind: github
    notes: Algorithmic trading bot. Onboarded 2026-04-26 via ai-playbook v0.3.1 bootstrap; first consumer to land with RFC-0001 skills_pins from day one.
    skills_pins:
      ai-playbook: v0.4.0
      eligia-skills: v0.2.0
  livekit:
    repo: Wizarck/livekit
    default_branch: master
    visibility: private
    personal: true
    status: active
    tracker_kind: github
    notes: Personal infra.

