# ai-playbook consumers registry — committed, org-level source of truth.
#
# Distinct from `~/.ai-playbook/projects.yaml` (per-dev, gitignored) which
# maps project names to local filesystem paths for dispatcher resolution.
# This file enumerates every downstream repo that consumes the playbook
# as a git submodule, so automation (GitHub Actions, LangGraph workflows)
# can open "bump playbook pin" PRs across the whole inventory when a new
# tag is cut.
#
# Add a consumer: PR against this file.
# Remove a consumer: PR against this file.
# The per-dev projects.yaml continues to hold local paths independently.
#
# Schema
# ------
#   schema: ai-playbook/consumers/v1
#   consumers:
#     <name>:
#       repo: <org>/<name>              # GitHub slug
#       default_branch: master | main   # base for PRs
#       submodule_path: .ai-playbook    # (optional, defaults to .ai-playbook)
#       personal: true | false          # (optional) personal add-on repo
#       visibility: public | private    # (optional, for audit)
#       status: active | paused | archived  # paused = skip automation
#       notes: free text                # (optional)
#       skills_pins:                    # (optional, RFC-0001) per-source-repo
#         <source-repo-slug>: <semver>  # tag pin for skills materialisation.
#                                       # Source slugs match the repo's bare
#                                       # name (e.g. `ai-playbook`,
#                                       # `consumer-d-skills`). Absence of a key
#                                       # = consumer doesn't pull from that
#                                       # source. propagate_skills_bump.py
#                                       # only opens PRs for consumers that
#                                       # already have a pin for the bumped
#                                       # source.
#
# Automation consumers of this file:
#   - .github/workflows/propagate-playbook-bump.yml (event-driven on tag push)
#   - .github/workflows/propagate-skills-bump.yml   (RFC-0001 Phase 2b)
#   - consumer-d/langgraph-aiops/workflows/playbook_bump_propagator.py (daily)
#   - scripts/bump_consumers.py (manual CLI; merges with projects.yaml for
#     resolution of local paths when run interactively)

schema: ai-playbook/consumers/v1
version: 1

consumers:
  consumer-c-legacy:
    repo: Wizarck/consumer-c-legacy
    default_branch: master
    visibility: public
    status: active
    notes: Community AGPL-3.0 repo.

  consumer-d:
    repo: Wizarck/consumer-d
    default_branch: master
    visibility: private
    personal: true
    status: active
    notes: Personal add-on alongside the playbook submodule.

  consumer-b:
    repo: Wizarck/consumer-b
    default_branch: master
    visibility: private
    status: active
    notes: Internal product (description redacted). Onboarded 2026-04-25.
