# Pre-commit hooks exported by ai-playbook (as a hook provider).
#
# Consumers wire these into their own `.pre-commit-config.yaml` like:
#
#   - repo: local
#     hooks:
#       - id: validate-skills-mirror
#         name: validate-skills-mirror (RFC-0001 drift guard)
#         entry: python -m scripts.validate_skills_mirror
#         language: system
#         pass_filenames: false
#         files: ^(skills|\.claude/skills|\.gemini/skills)/
#
# Or — preferred for consumers using the playbook submodule — the equivalent
# entry that calls into `.ai-playbook/scripts/`:
#
#   - repo: local
#     hooks:
#       - id: validate-skills-mirror
#         name: validate-skills-mirror (RFC-0001 drift guard)
#         entry: python .ai-playbook/scripts/validate_skills_mirror.py
#         language: system
#         pass_filenames: false
#         files: ^(skills|\.claude/skills|\.gemini/skills)/
#
# This file is for consumers who add ai-playbook to their `.pre-commit-config.yaml`
# as a remote `repo:` entry (less common; the canonical wiring is local).

- id: validate-skills-mirror
  name: validate-skills-mirror (RFC-0001 drift guard)
  description: |
    Validates that a consumer's .claude/skills/ and .gemini/skills/ are
    byte-for-byte copies of skills/. Pre-commit hook for RFC-0001 (skills
    distribution).
  entry: python -m scripts.validate_skills_mirror
  language: system
  pass_filenames: false
  # Run when any skill content changes — canonical or mirror.
  files: ^(skills|\.claude/skills|\.gemini/skills)/
  stages: [pre-commit]
