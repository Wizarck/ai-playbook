# Pre-commit hooks exported by ai-playbook (as a hook provider).
#
# Consumers reference these via:
#
#   repos:
#     - repo: https://github.com/Wizarck/ai-playbook
#       rev: v0.18.0
#       hooks:
#         - id: validate-pairing
#         - id: check-doc-language
#         - id: check-link-integrity
#         - id: check-agents-md-size
#
# All four hooks were added in v0.18.0 (slice filesystem-reorg-v018) to
# enforce the L1+L2+L3 paired enforcement convention. They run only on
# .rule.md / .rule.py / docs/** edits — they are no-ops on unrelated changes.

- id: validate-pairing
  name: validate-pairing (rule slug + paired_hardrule cross-reference)
  description: >-
    Enforces the 4-signal pairing per D3: filename slug, frontmatter slug,
    paired_hardrule field, AGENTS.md Rule Map entry. Exit 0 when every rule
    has all 4 signals consistent; exit 2 on any drift.
  entry: python -m scripts.validate_pairing
  language: system
  files: ^(docs/rules/|scripts/rules/|tests/test_).*$
  pass_filenames: false

- id: check-doc-language
  name: check-doc-language (ENGLISH-only docs/ enforcement)
  description: >-
    Per D6 — fails when more than 5% of tokens outside code blocks under
    docs/ are non-English. langdetect-based.
  entry: python -m scripts.check_doc_language
  language: system
  files: ^docs/.*\.md$
  pass_filenames: true

- id: check-link-integrity
  name: check-link-integrity (broken markdown links under docs/)
  description: >-
    Walks every relative markdown link under docs/ and verifies the target
    file exists. Exit 0 on clean; exit 2 with file:line on the first dead
    link.
  entry: python -m scripts.check_link_integrity
  language: system
  files: ^docs/.*\.md$
  pass_filenames: false
  args: [docs/]

- id: check-agents-md-size
  name: check-agents-md-size (D14 — 500-line cap)
  description: >-
    Fails CI when AGENTS.md exceeds 500 lines. Forces the situational
    pointer-list discipline.
  entry: python -m scripts.check_agents_md_size
  language: system
  files: ^AGENTS\.md$
  pass_filenames: false
