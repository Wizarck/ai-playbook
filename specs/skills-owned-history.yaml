# skills-owned-history.yaml — every skill slug this playbook has ever shipped.
#
# Purpose: let a consumer mirror that has no
# `.ai-playbook-state/skills-manifest.json` still recognise a skill the playbook
# REMOVED, and delete it on the consumer's first ordinary
# `bootstrap.py --update`.
#
# Without this list the materialiser cannot tell a removed playbook skill from a
# skill the consumer wrote: with no manifest it seeds ownership as
# `present ∩ desired`, which by construction excludes anything the current tag
# no longer wants, so the removed skill is never classified as stale — not on
# that run nor on any later one. It became a permanent orphan, and the only
# remedy was an out-of-band step in every consumer BEFORE it bumped. That is a
# push-model requirement, and this playbook is pull-model: consumers bump on
# their own schedule and nothing reaches into their repos. Hence this list.
#
# With it the seed becomes `present ∩ (desired ∪ ever_owned)`, so:
#   - a slug the playbook removed  -> owned, not desired -> stale -> deleted
#   - a slug the consumer authored -> in neither set     -> preserved untouched
#
# APPEND-ONLY. Never remove a slug: deleting one from here re-creates the orphan
# it exists to clear. Adding a new skill to `skills/` requires adding it here —
# `tests/test_materialise_skills.py` fails otherwise.
#
# Regenerate the historical portion with:
#   git log --all --pretty=format: --name-only --diff-filter=AMRD -- 'skills/*/SKILL.md'

