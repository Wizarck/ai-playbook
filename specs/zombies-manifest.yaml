# zombies-manifest.yaml — declarative inventory of consumer-side fossils
#
# Shipped with the ai-playbook submodule and consumed by
# `scripts/rules/cleanup-zombies.rule.py` on consumer-side `git pull` / `git checkout`.
#
# Contract: `docs/rules/cleanup-zombies.rule.md`. Schema: §2. Tier semantics: §3.
# Safety checks: §4.
#
# Rolling document. When a playbook release REMOVES or RENAMES any
# consumer-surface artefact (file the bootstrap script propagated, a
# frontmatter field, a literal name a consumer wired against), the release
# PR MUST append an entry here AND bump `manifest_version`. See
# `docs/runbooks/release.md` pre-cut checklist.
#
# DO NOT add entries for:
#   - Files removed from the playbook root that the consumer never received
#     (e.g. an internal workflow not in `templates/new-project/`).
#   - Files that still exist as templates (consumers still expect them).
#   - Operational scratch in `tmp/` / `__pycache__/` / `.ruff_cache/`
#     (not playbook-driven).

version: 1
manifest_version: "2026-09-06.1"

# NOTE (v0.19.0): the push-pipeline retirement deleted PLAYBOOK-INTERNAL
# files (consumers.yaml, consumers.yaml.example, propagate_bump.py,
# propagate-playbook-bump.yml). Those are NOT consumer-side fossils —
# consumers never had them in their own repos — so they belong in the
# CHANGELOG v0.19.0 "Migration notes" rather than in this manifest.
# Forks of the playbook that still ship a consumers.yaml should remove
# it manually; revoke any PLAYBOOK_PROPAGATION_TOKEN secret in their
# fork's repo settings.

entries:
  # -------------------------------------------------------------------------
  # Tier 1 — safe-delete (auto-removed by `cleanup_zombies.py --apply`)
  # -------------------------------------------------------------------------

  - id: skills-sources-submodule
    tier: 1
    action: delete
    safety: check_gitmodules_first
    path: .skills-sources
    introduced_in: v0.4.0
    removed_in: v0.17.0  # v0.17.0 dropped RFC-0001; submodule has no upstream use
    reason: >
      RFC-0001 multi-source pattern, removed upstream in ai-playbook v0.17.0
      (slice single-source-skills-reset). The `.skills-sources/` directory is
      always orphan now — no upstream code references it. Safety check
      `check_gitmodules_first` still applies (avoid deleting an active submodule
      a consumer somehow re-added).
    evidence: github.com/consumer-a/consumer-a/pull/125

  - id: skills-sources-git-modules-orphan
    tier: 1
    action: delete
    safety: directory_orphan
    path: .git/modules/.skills-sources
    introduced_in: v0.4.0
    removed_in: deprecation_only
    reason: >
      Git stores submodule metadata under `.git/modules/<name>/` and does not
      clean it on `git submodule deinit`. Once `.gitmodules` no longer lists
      the submodule, this directory is an orphan.
    evidence: github.com/consumer-a/consumer-a/pull/125

  - id: auto-managed-orphan-blocks
    tier: 3
    action: report
    safety: auto_managed_orphan
    path: "**/*.md"
    introduced_in: v0.2.0
    removed_in: deprecation_only
    reason: >
      `<!-- BEGIN auto-managed: <source> -->` blocks whose `<source>` no longer
      resolves to a live owner. Report-only: three subsystems materialise these
      blocks (auto_managed.py for `specs/*`, plus the caveman and ponytail
      toggles for their own prefixes), so "no owner" is a judgement call across
      three state files and not a safe basis for auto-deletion.
    evidence: docs/concepts/auto-managed-sections.md

  - id: hindsight-queue-rotation
    tier: 1
    action: rotate
    safety: file_mtime_and_drained
    path: .ai-playbook/hindsight-queue.jsonl
    introduced_in: v0.3.0
    removed_in: deprecation_only
    reason: >
      DEGRADED_CONTEXT retain queue. Once entries are marked
      `state: drained` AND file mtime > 30 days, rotate to
      `hindsight-queue.<date>.jsonl.archive` so the active queue stays small.
    evidence: docs/concepts/memory-hierarchy.md
    rotation_days: 30

  # -------------------------------------------------------------------------
  # Tier 2 — textual changes (auto-applied; logged for audit)
  # -------------------------------------------------------------------------

  - id: consumer-c-legacy-rename
    tier: 2
    action: rename
    safety: yaml_literal_rename
    path: "**/*.{yaml,yml,json}"
    rename_from: consumer-c-legacy
    rename_to: consumer-c
    rename_in_files:
      - mcp-servers.project.yaml
      - mcp-servers.yaml
      - consumers.yaml
      - .mcp.json
    introduced_in: v0.1.0
    removed_in: v0.14.1
    reason: >
      Consumer name change in playbook v0.14.1 (commit 0c3cd59 +
      release cb5c6f2). Consumers that hard-coded `consumer-c-legacy` in MCP /
      consumers YAML/JSON files need the literal updated to `consumer-c`.
    evidence: 0c3cd59

  # -------------------------------------------------------------------------
  # Tier 3 — report only (advisory; never modifies FS)
  # -------------------------------------------------------------------------

  - id: skills-sources-frontmatter-simplify
    tier: 3
    action: report
    safety: report_only
    path: AGENTS.md
    introduced_in: v0.4.0
    removed_in: v0.17.0  # multi-source pattern dropped upstream
    reason: >
      `AGENTS.md` declares any `skills_sources:` block. v0.17.0 removed RFC-0001
      entirely — the field is now dead text. Drop the block and use the
      single-source materialiser
      (`.ai-playbook/scripts/materialise_skills.py`).
    evidence: github.com/consumer-a/consumer-a/pull/125

  - id: inherits-from-too-old
    tier: 3
    action: report
    safety: report_only
    path: AGENTS.md
    introduced_in: v0.2.0
    removed_in: deprecation_only
    reason: >
      `inherits_from:` is pinned more than 3 MINOR versions behind the
      playbook bundled here. Many specs/skills/templates have changed since.
      Bump the pin and rerun bootstrap doctor.
    evidence: docs/concepts/dispatcher-chain.md
    max_minor_drift: 3

  - id: extra-skills-in-mirror
    tier: 3
    action: report
    safety: report_only
    path: "{skills,.claude/skills,.gemini/skills}/**/SKILL.md"
    introduced_in: v0.4.0
    removed_in: deprecation_only
    reason: >
      Skills present in a consumer mirror but NOT in the current
      `.ai-playbook/skills/` source. Causes: (a) playbook renamed/removed
      the skill (v0.7.0 alignment, commit ade4ca2; survivor list 4833403;
      v0.23.0 removed eleven — the BMad Builder set and the story/sprint
      loop); (b) consumer has a local custom skill — keep it but note the
      drift. Manual review required. If the finding names v0.23.0 skills,
      the mirror had no `.ai-playbook-state/skills-manifest.json` when the
      pin moved, so the materialiser could not classify them as stale;
      remove them by hand — see step 0 of docs/runbooks/upgrade-playbook-pin.md.
    evidence: 4833403

  - id: orphan-specs
    tier: 3
    action: report
    safety: report_only
    path: openspec/specs/**/*.md
    introduced_in: v0.2.0
    removed_in: deprecation_only
    reason: >
      Specs in `openspec/specs/` not referenced by any `openspec/changes/*/specs/`
      delta. Often residue from archived changes whose archive deleted the
      change folder but left the cumulative spec in place. Review and remove
      manually if no longer canonical.
    evidence: docs/concepts/runbook-bmad-openspec.md

  - id: pre-commit-deprecated-hooks
    tier: 3
    action: report
    safety: report_only
    path: .pre-commit-config.yaml
    introduced_in: v0.4.0
    removed_in: v0.17.0  # both scripts deleted upstream in v0.17.0
    reason: >
      Pre-commit entries invoking `propagate_skills_bump.py` or
      `validate_skills_mirror.py`. v0.17.0 deleted both scripts upstream
      (slice single-source-skills-reset); any consumer entry referencing them
      breaks `pre-commit run` with `command not found`.
    evidence: github.com/consumer-a/consumer-a/pull/125

  # -------------------------------------------------------------------------
  # v2 entries — added by ai-playbook v0.17.0
  # (slice single-source-skills-reset; RFC-0001 multi-source pattern removal)
  # -------------------------------------------------------------------------

  - id: propagate-skills-bump-script
    tier: 3
    action: report
    safety: report_only
    path: scripts/propagate_skills_bump.py
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      `scripts/propagate_skills_bump.py` was deleted from the playbook in
      v0.17.0 (slice single-source-skills-reset). Any consumer-side wrapper
      that invokes this script as `.ai-playbook/scripts/propagate_skills_bump.py`
      will fail with `FileNotFoundError`. Remove the wrapper or migrate to the
      single-source pattern (no per-source propagation needed any more).
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: validate-skills-mirror-script
    tier: 3
    action: report
    safety: report_only
    path: scripts/validate_skills_mirror.py
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      `scripts/validate_skills_mirror.py` was deleted from the playbook in
      v0.17.0. The new materialiser's fingerprint-equality short-circuit
      obsoletes the drift check. Any consumer-side direct invocation
      (`python .ai-playbook/scripts/validate_skills_mirror.py`) will fail.
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: propagate-skills-bump-workflow
    tier: 3
    action: report
    safety: report_only
    path: .github/workflows/propagate-skills-bump.yml
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      `.github/workflows/propagate-skills-bump.yml` was deleted from the
      playbook in v0.17.0. The workflow fanned out per-consumer PRs on every
      tag push of a skills source repo; with single-source the playbook tag
      IS the skills tag, so the existing `propagate-playbook-bump.yml`
      already covers the propagation. Consumer copies of this workflow
      (uncommon — never templated) should be removed.
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: rfcs-folder-removed
    tier: 3
    action: report
    safety: report_only
    path: rfcs
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      The `rfcs/` folder (housing RFC-0001-skills-distribution.md and its
      README) was deleted entirely in v0.17.0. Markdown cross-references to
      `rfcs/RFC-0001-skills-distribution.md` now return 404 on the rendered
      mkdocs site. Migrate prose references to `docs/concepts/skills-distribution.md`
      v2.0.0.
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: skills-sources-submodule-v2
    tier: 1
    action: delete
    safety: check_gitmodules_first
    path: .skills-sources
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      Tightens the v1 entry `skills-sources-submodule`. Post-v0.17.0 the
      upstream playbook has zero use for `.skills-sources/` — the directory
      is always orphan. Safety check still verifies the consumer has
      deregistered the submodule via `.gitmodules`; once that holds, the
      directory is safe-delete.
    evidence: ai-playbook v0.17.0 CHANGELOG; consumer-a PR #125

  - id: skills-sources-frontmatter
    tier: 3
    action: report
    safety: report_only
    path: AGENTS.md
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      Expansion of v1 entry `skills-sources-frontmatter-simplify`. Now flags
      ANY `skills_sources:` block in AGENTS.md (previously only flagged
      single-entry blocks). Post-v0.17.0 the field is dead text; no upstream
      code reads it.
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: skills-pins-consumers-yaml
    tier: 3
    action: report
    safety: report_only
    path: consumers.yaml
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      `consumers.yaml.<name>.skills_pins:` keys are stale post-v0.17.0. The
      propagator that consumed them (`propagate_skills_bump.py`) was deleted;
      the schema's `additionalProperties: true` keeps the keys valid, but
      they are no-ops. Remove on the next consumers.yaml edit.
    evidence: ai-playbook v0.17.0 CHANGELOG

  - id: validate-skills-mirror-precommit-hook
    tier: 3
    action: report
    safety: report_only
    path: .pre-commit-config.yaml
    introduced_in: v0.4.0
    removed_in: v0.17.0
    reason: >
      Pre-commit hook entries with `id: validate-skills-mirror`. v0.17.0
      removed both the script (`scripts/validate_skills_mirror.py`) and the
      hook export (`.pre-commit-hooks.yaml`). Any consumer entry referencing
      the local script breaks `pre-commit run` with `command not found`;
      entries referencing the remote `repo: <ai-playbook>` hook get a missing-hook
      error.
    evidence: ai-playbook v0.17.0 CHANGELOG

  # -------------------------------------------------------------------------
  # v3 entries — added by ai-playbook v0.17.1
  # (slice root-folder-audit; clean root before slice 4 filesystem reorg)
  # See docs/concepts/root-folder-audit.md for the per-file ledger.
  # -------------------------------------------------------------------------

  - id: feedback-md-removed
    tier: 3
    action: report
    safety: report_only
    path: FEEDBACK.md
    introduced_in: v0.2.0
    removed_in: v0.17.1
    reason: >
      `FEEDBACK.md` was deleted from the playbook in v0.17.1 (slice
      root-folder-audit). It was an append-only gripe channel designed for
      multi-contributor triage; under sole-consumer reality it was never
      triaged. Consumers that templated a copy at their own root should
      remove it. Error messages in `scripts/mcp/render.py` +
      `scripts/mcp/validate.py` that previously pointed here now point at a
      GitHub issue.
    evidence: ai-playbook v0.17.1 CHANGELOG

  - id: mcp-servers-base-relocated
    tier: 3
    action: report
    safety: report_only
    path: mcp-servers-base.yaml
    introduced_in: v0.3.0
    removed_in: v0.17.1
    reason: >
      `mcp-servers-base.yaml` moved from the playbook root to
      `templates/rendered/mcp-servers-base.yaml.tmpl` in v0.17.1 (slice
      root-folder-audit). Consumers MUST NOT reference the old path
      directly. The upstream loaders (`scripts/mcp/validate.py:load_layers`,
      `scripts/mcp/render.py`) already read from the new location; any
      hand-rolled consumer script that hard-coded the old path needs an
      update.
    evidence: ai-playbook v0.17.1 CHANGELOG

  - id: pricing-yaml-relocated
    tier: 3
    action: report
    safety: report_only
    path: pricing.yaml
    introduced_in: v0.4.0
    removed_in: v0.17.1
    reason: >
      `pricing.yaml` moved from the playbook root to `configs/pricing.yaml`
      in v0.17.1 (slice root-folder-audit). `scripts/cost_report.py` now
      reads from the new path by default; consumer scripts that invoked
      `cost_report` with an explicit `--pricing <playbook>/pricing.yaml`
      argument MUST update the path. Slice 6 (telemetry, v0.19.1) will
      continue to load from `configs/pricing.yaml`.
    evidence: ai-playbook v0.17.1 CHANGELOG

  - id: ai-playbook-egg-info-orphan
    tier: 1
    action: delete
    safety: directory_orphan
    path: ai_playbook.egg-info
    introduced_in: v0.2.0
    removed_in: v0.17.1
    reason: >
      `ai_playbook.egg-info/` is a `pip install -e .` build artefact that
      should never live in git. `.gitignore` already covers `*.egg-info/`,
      so the directory is always untracked. Consumers that happened to
      commit the directory pre-gitignore (rare) get it cleaned up via the
      `directory_orphan` safety check (deletes only if no tracked files
      under it). Removing on the playbook side too in v0.17.1 to keep the
      root tidy.
    evidence: ai-playbook v0.17.1 CHANGELOG

  - id: issue-sync-workflow-removed
    tier: 3
    action: report
    safety: report_only
    path: .github/workflows/issue-sync.yml
    introduced_in: v0.3.0
    removed_in: v0.17.1
    reason: >
      `.github/workflows/issue-sync.yml` was deleted from the playbook in
      v0.17.1 (slice root-folder-audit). The workflow opened Jira tickets
      or GH Issues on every merged `openspec/changes/**/proposal.md`;
      sole consumer (Arturo) does not use it. Consumers that bootstrapped a
      copy at `.github/workflows/issue-sync.yml` should remove it. The
      underlying `scripts/issue_sync.py` is NOT deleted; slice 6 (telemetry,
      v0.19.1) may absorb it.
    evidence: ai-playbook v0.17.1 CHANGELOG

  # -------------------------------------------------------------------------
  # v4 — Slice 4 filesystem reorganisation (v0.18.0 BREAKING)
  #
  # Mass rename: specs/ -> docs/{rules,concepts}/, runbooks/ -> docs/runbooks/,
  # scripts/cleanup_zombies.py -> scripts/rules/cleanup-zombies.rule.py,
  # specs/agent-contract.schema.json -> schemas/schema-agent-contract.json,
  # .github/workflows/doc-drift-check.yml -> .github/workflows/doc-drift-enforcement.rule.yml.
  #
  # Consumers' inherits_from: arrays in AGENTS.md frontmatter often listed
  # `.ai-playbook/specs/<contract>.md` paths; those break on v0.18.0 bump.
  # The entries below are Tier 3 (report-only) — the playbook does not own
  # the consumer-side AGENTS.md, so cleanup-zombies surfaces the drift
  # without auto-rewriting.
  # -------------------------------------------------------------------------

  - id: specs-folder-mixed-content-emptied-v0.18.0
    tier: 3
    action: report
    safety: report_only
    path: specs
    introduced_in: v0.1.0
    removed_in: v0.18.0
    reason: >
      v0.18.0 (slice filesystem-reorg-v018) moved all rule/concept markdown
      out of `specs/` to `docs/{rules,concepts}/`. The `specs/` directory
      now holds ONLY operational YAMLs (zombies-manifest.yaml,
      co-edit-pairs.yaml). Consumer AGENTS.md `inherits_from:` arrays that
      reference old paths (e.g. `.ai-playbook/specs/verdict-contract.md`)
      will fail to resolve. Update consumer manifests to point to
      `.ai-playbook/docs/rules/verdict-contract.rule.md`.
    evidence: ai-playbook v0.18.0 CHANGELOG migration table

  - id: scripts-cleanup-zombies-renamed-v0.18.0
    tier: 3
    action: report
    safety: report_only
    path: scripts/cleanup_zombies.py
    introduced_in: v0.15.0
    removed_in: v0.18.0
    reason: >
      v0.18.0 (slice filesystem-reorg-v018) moved
      `scripts/cleanup_zombies.py` to
      `scripts/rules/cleanup-zombies.rule.py` per the paired L1 hook
      convention. Consumer git hooks (`post-merge` / `post-checkout`) that
      invoke `python .ai-playbook/scripts/cleanup_zombies.py` will fail
      after the v0.18.0 bump. Update the hook to invoke
      `python .ai-playbook/scripts/rules/cleanup-zombies.rule.py`.
      `templates/new-project/scripts/git-hooks/*.tmpl` already updated
      upstream.
    evidence: ai-playbook v0.18.0 CHANGELOG migration table

  - id: runbooks-folder-moved-v0.18.0
    tier: 3
    action: report
    safety: report_only
    path: runbooks
    introduced_in: v0.5.0
    removed_in: v0.18.0
    reason: >
      v0.18.0 moved `runbooks/` to `docs/runbooks/` (Diátaxis layout).
      Consumer docs that cross-link to upstream runbooks via
      `.ai-playbook/runbooks/...` paths break. Update to
      `.ai-playbook/docs/runbooks/...`.
    evidence: ai-playbook v0.18.0 CHANGELOG migration table

  - id: doc-drift-check-workflow-renamed-v0.18.0
    tier: 3
    action: report
    safety: report_only
    path: .github/workflows/doc-drift-check.yml
    introduced_in: v0.16.0
    removed_in: v0.18.0
    reason: >
      v0.18.0 renamed `.github/workflows/doc-drift-check.yml` to
      `.github/workflows/doc-drift-enforcement.rule.yml` per the paired
      enforcement naming convention. Consumer fork copies of this workflow
      should be renamed; branch-protection required-check names need to be
      updated by the repo admin.
    evidence: ai-playbook v0.18.0 CHANGELOG migration table

  - id: agent-contract-schema-moved-v0.18.0
    tier: 3
    action: report
    safety: report_only
    path: specs/agent-contract.schema.json
    introduced_in: v0.4.0
    removed_in: v0.18.0
    reason: >
      v0.18.0 moved `specs/agent-contract.schema.json` to
      `schemas/schema-agent-contract.json` (top-level schemas/ per industry
      convention). Consumer scripts that resolved the schema from the old
      path break.
    evidence: ai-playbook v0.18.0 CHANGELOG migration table
