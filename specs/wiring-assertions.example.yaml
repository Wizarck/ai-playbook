# wiring-assertions.example.yaml — worked instantiation for a hypothetical consumer
#
# Contract: `wiring-assertions.schema.yaml`. Severity semantics:
# `docs/rules/verdict-contract.rule.md` §Severity levels.
#
# Every `by` regex below was executed against the real files of a production
# codebase of this shape (2026-08-01) before this file was written. Each carries
# a `# verified against:` comment quoting the registry line it matched, and a
# `# result:` line with the measured population / findings. No regex here is
# aspirational. Module names, paths, line numbers and counts are generalised
# from that run so nothing here identifies the codebase.
#
# Coverage measured at authoring time:
#   blueprint-router-included           16 routers,   14 wired,  2 allowed,  0 findings
#   celery-task-routed                 107 tasks,     99 wired,  8 allowed,  0 findings
#   job-entries-module-registered        6 modules,    6 wired,  0 allowed,  0 findings
#   ops-channel-module-labeled           5 modules,    3 wired,  0 allowed,  2 FINDINGS (S3)
#   alembic-single-head-chain          108 revisions,107 wired,  1 head,     0 findings
#   delta-adapter-in-type-registry       9 adapters,   9 wired,  0 allowed,  0 findings

schema: ai-playbook/wiring-assertions/v1
schema_version: "1.0.0"
root: "."

defaults:
  flags: "m"
  status: enforced

assertions:

  # =========================================================================
  # 1. FastAPI blueprint routers -> app.include_router() in main.py
  # =========================================================================
  - id: blueprint-router-included
    description: >-
      Every blueprint that ships a `router.py` must be mounted on the FastAPI
      app in `main.py`; an unmounted blueprint's endpoints 404 in production
      while its tests (which build their own app) stay green.
    every: backend/app/blueprints/*/router.py
    referenced_in: backend/app/main.py
    # `{dir}` is the blueprint directory name (`auth`, `user_profiles`), which
    # is also the exported APIRouter alias `<dir>_bp`. `\s*` spans the newline
    # in the multi-line call form, so both single- and multi-line registrations
    # match under the default `m` flag.
    by: |-
      include_router\(\s*{dir}_bp\b
    # verified against: `app.include_router(auth_bp, prefix="/auth", tags=["auth"])`   (main.py:329)
    # verified against: `app.include_router(\n    beta_bp,\n    prefix=...` (main.py:375-380, multi-line form)
    # result: 16 matched routers; 14 referenced; 2 unreferenced, both allowed below.
    severity: S1
    evidence: "backend/app/main.py:329-551"
    allow:
      - match: backend/app/blueprints/gamma/router.py
        reason: >-
          `gamma_bp` is the aggregate router, imported in main.py
          only to keep test imports resolving (`# noqa: F401 — kept for test
          imports`). The live gamma surface is mounted per sub-router
          (`gamma_webhooks_router`, `gamma_audit_router`, `gamma_export_router`,
          `gamma_settings_router`, `gamma_sync_router`,
          `gamma_accounts_router`), each with its own prefix; mounting the
          aggregate as well would double-register those paths.
        evidence: "backend/app/main.py:304 + 544-551"
      - match: backend/app/blueprints/delta/router.py
        reason: >-
          Same shape as gamma. `delta_bp` is imported `# noqa: F401 — kept for
          test imports`; the live delta surface is mounted from
          `app.blueprints.delta.routers` (`sources_router`, `pools_router`,
          `inventory_router`, `jobs_router`, `events_router`,
          `schemas_router`, `admin_dlq_router`).
        evidence: "backend/app/main.py:294-303 + 462-493"

  # =========================================================================
  # 2. Celery tasks -> celery_app.conf.task_routes   (THE PRECEDENT BUG)
  # =========================================================================
  - id: celery-task-routed
    description: >-
      Every Celery task must have an explicit `task_routes` entry; a task
      without one silently falls back to `task_default_queue` ("default"), so
      its intended queue has no producer and the `realtime` queue can starve
      under load.
    # `task_routes` lives in `backend/app/celery_app.py` — a single ~950-line
    # module that is BOTH the Celery app factory and the routing registry. The
    # entries are spread across ~30 slice-marked blocks, which is exactly why a
    # slice can add a task and forget the route.
    every: backend/app/tasks/*_tasks.py::@celery_app.task* def:*
    referenced_in: backend/app/celery_app.py
    # Celery's default task name is `<module-path>.<func>`, so `{stem}` +
    # `{symbol}` reconstruct it. The trailing alternation is what makes this
    # regex actually catch the bug: it demands the name appear in ENTRY
    # position, i.e. followed by `] =` (subscript assignment), `:` (dict-literal
    # key) or `,` (tuple element in the `for _task in (...)` loops). The
    # negative lookbehind excludes `"task": "<name>"` — the `beat_schedule`
    # shape. A bare-name regex would have PASSED on the pre-fix tree, because the
    # heartbeat slice added the beat entry and the import but no route.
    by: |-
      (?<!"task": )["\x27]app\.tasks\.{stem}\.{symbol}["\x27]\s*(?:\]\s*=|:|,)
    # verified against: `celery_app.conf.task_routes["app.tasks.heartbeat_tasks.emit_liveness_heartbeat"] = {"queue": "scheduled"}`  (celery_app.py:729)
    # verified against: `        "app.tasks.job_tasks.run_all_jobs_task": {"queue": "default"},`  (celery_app.py:75, dict-literal form)
    # verified against: `    "app.tasks.report_tasks.collect_daily_report",`  (celery_app.py:801, for-loop tuple form)
    # REGRESSION PROOF: run against `celery_app.py` as it stood before the fix
    #   commit, this regex returns no match for `emit_liveness_heartbeat`; against
    #   the fixed file it matches celery_app.py:729. It reproduces the precedent
    #   bug exactly.
    # result: 107 decorated tasks; 99 referenced; 8 unreferenced, all allowed below.
    severity: S1
    evidence: "fix commit restoring the missing heartbeat task_routes entry; Jira PROJ-890 routing audit; backend/tests/integration/test_celery_routing.py::test_all_tasks_have_explicit_route"
    # The allow list is exactly the set of tasks whose decorator passes an
    # explicit `name=` that DIFFERS from the module-path default. Each was
    # verified to be routed under its custom name in celery_app.py. Tasks whose
    # explicit `name=` equals the default need no exemption — the regex finds
    # them unchanged.
    allow:
      - match: backend/app/tasks/ingest_tasks.py::sync_source_all
        reason: 'Explicit `name="ingest.sync_source_all"`; routed under that name at celery_app.py:597.'
      - match: backend/app/tasks/ingest_tasks.py::fan_out_ingest_source_syncs
        reason: 'Explicit `name="ingest.fan_out_ingest_source_syncs"`; routed at celery_app.py:598.'
      - match: backend/app/tasks/audit_bulk_tasks.py::process_bulk_job
        reason: 'Explicit `name="audit.process_bulk_job"`; routed at celery_app.py:156.'
      - match: backend/app/tasks/audit_bulk_tasks.py::cleanup_audit_bulk_jobs
        reason: 'Explicit `name="audit.cleanup_audit_bulk_jobs"`; routed at celery_app.py:157.'
      - match: backend/app/tasks/audit_engine_tasks.py::audit_runner_task
        reason: 'Explicit bare `name="audit_runner_task"` (no module prefix); routed at celery_app.py:528.'
      - match: backend/app/tasks/audit_engine_tasks.py::run_discover_for_plugin
        reason: 'Explicit bare `name="run_discover_for_plugin"`; routed at celery_app.py:529.'
      - match: backend/app/tasks/audit_engine_tasks.py::audit_deadline_processor_task
        reason: 'Explicit bare `name="audit_deadline_processor_task"`; routed at celery_app.py:530.'
      - match: backend/app/tasks/audit_engine_tasks.py::process_deadlines_for_tenant
        reason: 'Explicit bare `name="process_deadlines_for_tenant"`; routed at celery_app.py:531.'
    # KNOWN SCOPE LIMIT (not a defect of this assertion, a deliberate boundary):
    # `every` covers `backend/app/tasks/*_tasks.py` only. Tasks defined inside
    # blueprints — e.g. `app.blueprints.notifications.tasks.notification_email_tasks`
    # — are out of population; they are routed under `notifications.*` custom
    # names via the late-binding block at celery_app.py:470-499. Covering them
    # needs a second assertion with its own name derivation, deliberately not
    # bundled here.

  # =========================================================================
  # 3. Job entry modules -> the package __init__ that imports them
  # =========================================================================
  - id: job-entries-module-registered
    description: >-
      Every `*_entries.py` job module must be imported by the jobs package
      `__init__`; registration happens as an import-time side effect
      (`register(JobEntry(...))` at module scope), so an unimported module
      leaves its job cards absent from the dashboard and its "Run now" façade
      unroutable, with no error anywhere.
    every: backend/app/blueprints/_shared/jobs/*_entries.py
    referenced_in: backend/app/blueprints/_shared/jobs/__init__.py
    # The `__init__` uses a single parenthesised `from ... import (...)` block,
    # one module per line, trailing comma on every entry. `(?m)^` via the
    # default `m` flag anchors to the line so a mention inside the docstring
    # does not count as a registration.
    by: |-
      ^\s*{stem}\s*,
    # verified against: `    alpha_entries,`  (_shared/jobs/__init__.py:7)
    # result: 6 matched modules (alpha, beta, gamma, delta,
    #         audit, system); all 6 referenced; 0 findings.
    severity: S1
    evidence: "backend/app/blueprints/_shared/jobs/__init__.py:6-13; runtime half-check at backend/app/main.py:35-62 (_verify_job_registry)"
    # NOTE ON THE ADJACENT ASSERTION THAT IS **NOT** ENCODED HERE.
    # The literal form "a job task has no JobEntry" is NOT expressible as a
    # regex assertion in this repo, and encoding it would be a false detector.
    # Measured: of the 26 `@celery_app.task` functions in job_tasks.py,
    # export_tasks.py and channel_tasks.py, only 8 carry a `celery_task_name`
    # in any `*_entries.py` — and that is CORRECT. The other 18
    # (`fan_out_user_jobs`, `run_member_batch_task`, `renew_single_channel_task`,
    # `execute_archive_batch_task`, ...) are internal fan-out / per-item worker
    # tasks with no user-facing job card, and no static marker distinguishes
    # them from the 8 entry-point tasks. An assertion over that population would
    # be ~69% false positive and would be silenced with an 18-entry allow list —
    # i.e. fiction. The module-import direction above is the same wiring bug in
    # its statically decidable form; the task->entry direction is covered at
    # runtime instead by `_verify_job_registry()` (main.py:35), which resolves
    # `entry.celery_task_name` against `celery_app.tasks` at app startup.

  # =========================================================================
  # 4. Realtime channel modules -> MODULE_LABELS in the ops Channels page
  # =========================================================================
  - id: ops-channel-module-labeled
    description: >-
      Every realtime channel family in the backend's `KNOWN_MODULES` must have a
      `MODULE_LABELS` entry on the ops Channels page; without one the group
      header renders the raw module id and the description line disappears.
    # `member:` walks the string literals inside the named tuple, so `{symbol}`
    # is the module id itself. Note the literal parentheses in the Next.js
    # route-group path — matched literally, not as glob metacharacters.
    every: backend/app/blueprints/_shared/ops_events.py::member:KNOWN_MODULES
    referenced_in: frontend/app/(ops)/ops/channels/ChannelsPageClient.tsx
    # Anchored inside the MODULE_LABELS object literal so an identically-named
    # key in a sibling map (STATUS_LABELS) cannot satisfy it. `[^=]*` crosses the
    # TS type annotation `: Record<string, { name: string; description: string }>`
    # (which contains `;` but no `=`); `[^;]*?` then stays inside the object body,
    # which holds no `;` until its closing `};`.
    by: |-
      MODULE_LABELS[^=]*=\s*\{[^;]*?\b{symbol}\b\s*:
    # verified against: `  alpha_changes: {`  (ChannelsPageClient.tsx:59)
    # verified against: `  admin: {`          (ChannelsPageClient.tsx:43)
    # result: KNOWN_MODULES = (admin, alpha_changes, admin_reports,
    #         delta_job_events, beta_job_progress).
    #         3 referenced; 2 UNREFERENCED -> this assertion FIRES TODAY on
    #         `delta_job_events` and `beta_job_progress`.
    #         (Both are also absent from the sibling MODULE_LABELS in
    #         frontend/app/(ops)/ops/events/EventsPageClient.tsx:23-27.)
    # S3, not S1: the page degrades gracefully — `moduleInfo?.name ?? application`
    # (ChannelsPageClient.tsx:348) renders the raw id and `{moduleInfo && (...)}`
    # (:358) drops the description. A reader pays a tax; nothing breaks.
    severity: S3
    # Landing state: the two open findings are real and pre-existing, so the
    # assertion ships advisory and flips to `enforced` in the PR that adds the
    # two labels. Per the consumer's ledger rule, that flip needs a row in
    # `docs/operations/deferred-items.md`.
    status: advisory
    evidence: "backend/app/blueprints/_shared/ops_events.py:29-35 (KNOWN_MODULES); frontend/app/(ops)/ops/channels/ChannelsPageClient.tsx:42-67"

  # =========================================================================
  # 5. Alembic migrations -> the single-head chain
  # =========================================================================
  - id: alembic-single-head-chain
    description: >-
      Every Alembic revision except the single chain tip must be named as a
      `down_revision` by another migration; a revision nobody parents is a
      second head, and `alembic upgrade head` then aborts with "Multiple head
      revisions are present" — breaking deploys, the CI migrate step, and any
      container entrypoint that runs `alembic upgrade head`.
    every: backend/alembic/versions/*.py
    # The registry IS the migration corpus: a chain-shaped registry where each
    # file registers its parent. `referenced_in` therefore globs the same set.
    referenced_in: backend/alembic/versions/*.py
    # `exclude_self` (default true) keeps a file's own `revision = "X"` line
    # from satisfying itself.
    exclude_self: true
    # Identity is the declared revision id, not the filename — they diverge
    # (`001_initial_schema.py` declares `revision: str = "001"`). The optional
    # `(?:\s*:[^=\n]*)?` absorbs the annotated forms `revision: str = "..."`.
    capture: |-
      ^revision(?:\s*:[^=\n]*)?\s*=\s*["\x27](?P<value>[^"\x27]+)["\x27]
    # `down_revision` is written four ways in this tree — bare string, annotated
    # string (`down_revision: str | None = "..."`), `Union[str, None]`, and merge
    # tuples that span lines (`down_revision: tuple[str, str] = (\n "a",\n "b",\n)`).
    # The bounded `[\s\S]{0,300}?` lazily crosses the annotation and the tuple
    # body without running past the statement into unrelated code.
    by: |-
      \bdown_revision\b[\s\S]{0,300}?["\x27]{capture}["\x27]
    # verified against: `down_revision = "0017_widget_name_unique"`  (0018_widget_state_and_audit.py)
    # verified against: `down_revision: str | None = "016b_widen_alembic_version"`  (0017_widget_name_unique.py)
    # verified against: `down_revision: tuple[str, str] = (`  (0020_merge_heads.py, merge-node form)
    # result: 108 migrations, 108 revision ids captured (0 capture failures);
    #         exactly 1 unreferenced -> `0090_add_reporting_dimension`, the
    #         legitimate single head. 0 findings.
    # A second head makes unreferenced == 2 and emits 1 finding.
    unreferenced_max: 1
    severity: S1
    evidence: ".ai-playbook/docs/rules/alembic-single-head.rule.md"
    # SCOPE NOTE: this is the STATIC, corpus-local half of the invariant and is
    # blind to the cross-branch fork — a sibling head already merged into the
    # base that your non-rebased working tree does not contain. The playbook's
    # `alembic-single-head.rule.py validate --base auto` after `git fetch` is the
    # enforcer for that case; this assertion does not replace it.

  # =========================================================================
  # 6. Delta adapters -> the job_type plugin registry
  # =========================================================================
  - id: delta-adapter-in-type-registry
    description: >-
      Every per-`job_type` delta adapter module must have an entry in
      `type_registry.REGISTRY`; the job dispatcher looks the adapter up by
      `job.job_type` and fails the job permanently with "unknown job_type" when
      the lookup misses, so an unregistered adapter is fully-built dead code.
    every: backend/app/blueprints/delta/adapters/*.py
    # Private helpers shared by the adapters are never registry members. This is
    # `exclude`, not `allow`: they are out of scope by construction rather than
    # reviewed exceptions, and a new `_helper.py` must not need an allow entry.
    exclude:
      - backend/app/blueprints/delta/adapters/_*.py
      - backend/app/blueprints/delta/adapters/__init__.py
    referenced_in: backend/app/blueprints/delta/type_registry.py
    # The registry imports each adapter as `<stem> as <stem>_adapter` and every
    # RegistryEntry carries a `"module"` key pointing at that alias. Anchoring on
    # `"module":` rather than on the bare alias is what makes this a wiring check
    # and not an import check — the import alone would satisfy a looser regex
    # while the REGISTRY entry stayed absent, which is precisely the bug.
    by: |-
      ["\x27]module["\x27]\s*:\s*{stem}_adapter\b
    # verified against: `        "module": s3_adapter,`  (type_registry.py:93)
    # verified against: `        "module": s3_copy_adapter,`  (type_registry.py:148)
    # result: 14 files in adapters/; 5 excluded (__init__, _common, _error_messages,
    #         _large_file, _metadata); 9 adapters in population (s3, s3_copy,
    #         gcs, azure_blob, sftp, webdav, local_fs, imap, smtp); all 9
    #         referenced; 0 findings.
    # `exactly_one`: two REGISTRY entries pointing at the same adapter module
    # would mean two job_types share one adapter, which this codebase does not do
    # and which would make the schema_path/type_config mapping ambiguous.
    expect: exactly_one
    severity: S1
    evidence: "backend/app/blueprints/delta/type_registry.py:83-180; dispatcher lookup at backend/app/tasks/dispatch_tasks.py:548-556"
