# Pricing catalog for cost_report.py
#
# When this file exists, cost_report.py computes estimated_cost_usd per row.
# Without it, costs are reported as None.
#
# Format:
#   <model_name>:
#     input_per_1k:       USD per 1000 input tokens
#     output_per_1k:      USD per 1000 output tokens
#     cache_read_per_1k:  USD per 1000 cache-read tokens (Anthropic prompt caching)
#
# Model names match what providers report in `gen_ai.response.model` event attr.
# Loader is at ai-playbook/scripts/telemetry/report.py:load_pricing (absorbed
# from the deleted scripts/cost_report.py in Slice 6, v0.18.2).
#
# Last updated: 2026-04-26 (Anthropic Claude 4.x family + Gemini 2.5 + OpenRouter passthroughs)

