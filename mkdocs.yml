site_name: "ai-playbook"
site_description: "L1/L2/L3 paired-enforcement playbook for LLM-driven development — Claude / Gemini / Cursor portable, Diátaxis-inspired."
site_url: "https://wizarck.github.io/ai-playbook/"
repo_url: "https://github.com/Wizarck/ai-playbook"
repo_name: "Wizarck/ai-playbook"
edit_uri: "edit/main/docs/"

# Dogfood the existing docs/ tree instead of duplicating content under a separate docs_dir.
docs_dir: docs

theme:
  name: material
  palette:
    # Light mode (default).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

# Many docs intentionally link to siblings outside docs_dir (scripts/, schemas/, .github/).
# mkdocs cannot resolve those, but the playbook's own check_link_integrity.py validates
# them on the actual filesystem. Soften link validation so --strict does not fail on
# expected cross-tree references.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
    anchors: warn

