site_name: "ai-playbook"
site_description: "Universal AI-dev norms, specs, scripts, and templates for Wizarck org projects."
site_url: "https://wizarck.github.io/ai-playbook/"
repo_url: "https://github.com/Wizarck/ai-playbook"
repo_name: "Wizarck/ai-playbook"
edit_uri: "edit/master/docs/"

# Dogfood the existing docs/ tree instead of duplicating content under a separate docs_dir.
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Start here: start-here.md
  - Onboarding:
      - Quickstart: quickstart.md
      - Quickstart lessons: quickstart-lessons.md
      - SessionStart hook: session-start-hook.md
      - Contributing: contributing.md
  - Architecture:
      - Diagrams: architecture-diagrams.md
      - Bootstrap new project: bootstrap-new-project.md
      - Why these choices: why-these-choices.md
      - Model migration: model-migration.md
  - Specs:
      - Index: ../specs/INDEX.md
      - Agent contract: ../docs/concepts/agent-contract.md
      - Agentic failures: ../docs/concepts/agentic-failures.md
      - Bootstrap directive: ../docs/rules/bootstrap-directive.rule.md
      - Break-glass: ../docs/rules/break-glass.rule.md
      - Degradation modes: ../docs/concepts/degradation-modes.md
      - Dispatcher chain: ../docs/concepts/dispatcher-chain.md
      - Env vars: ../docs/concepts/env-vars.md
      - Error message standard: ../docs/rules/error-message-standard.rule.md
      - MCP servers schema: ../docs/concepts/mcp-servers-schema.md
      - Memory hierarchy: ../docs/concepts/memory-hierarchy.md
      - Migration guide: ../docs/concepts/migration-guide.md
      - Model routing: ../docs/concepts/model-routing.md
      - Notification policy: ../docs/concepts/notification-policy.md
      - Parallel review: ../docs/concepts/parallel-review.md
      - Projects registry: ../docs/concepts/projects-registry.md
      - Prompt caching: ../docs/concepts/prompt-caching.md
      - Retrospective cadence: ../docs/concepts/retrospective-cadence.md
      - Runbook (BMAD + OpenSpec): ../docs/concepts/runbook-bmad-openspec.md
      - Taxonomy: ../docs/concepts/taxonomy.md
      - Verdict contract: ../docs/rules/verdict-contract.rule.md
