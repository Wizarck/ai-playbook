# branch-name-validator.yml
#
# CI gate: enforce that every PR branch name matches the canonical pattern
# `<type>/<change-id>` AND that the corresponding `openspec/changes/<change-id>/`
# directory exists in the PR's HEAD ref.
#
# Per docs/development-flow.md §1 (hierarchy) and §5 (industrialisation).
# Spec: specs/release-management.md §6.5 (slice/<change-id> branch model).
#
# Allowed types: feat, fix, chore, docs, refactor, test, release.
# Pattern:       <type>/<change-id> where change-id is [a-z0-9][a-z0-9-]*
#                                                        (kebab-case, max 64 chars)
#
# Exemptions:
# - main, master                  — no PRs land directly on main; this guard is
#                                   here only to prevent accidental triggers.
# - dependabot/...                — dependency bot branches (no OpenSpec change
#                                   required for vendored bumps).
# - revert-N-...                  — auto-generated by GitHub revert button.
# - feat/v<X.Y.Z>-...             — release-prep branches accumulating multiple
#                                   changes for a release; OpenSpec dir not
#                                   required (the bundle is the change).
#
# Soft enforcement: comments on the PR with the violation. Hard gate at merge
# time: status check fails until the branch is renamed.

name: branch-name-validator

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # so we can comment on the PR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need the actual files of the PR head, not the merge commit, so
          # we can verify openspec/changes/<change-id>/ exists in the branch.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate branch name + openspec/changes path
        id: validate
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          echo "Branch: $BRANCH"

          # Exemption patterns — match return success.
          case "$BRANCH" in
            main|master)
              echo "::warning::PR head ref is on a protected branch; this should not happen via the normal flow."
              echo "verdict=exempt-protected" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            dependabot/*)
              echo "Exempt: dependabot branch."
              echo "verdict=exempt-dependabot" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            revert-*)
              echo "Exempt: GitHub auto-revert branch."
              echo "verdict=exempt-revert" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            feat/v[0-9]*|chore/release/v[0-9]*)
              echo "Exempt: release-prep branch."
              echo "verdict=exempt-release-prep" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Canonical pattern: <type>/<change-id>
          if ! [[ "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test|release)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "verdict=fail-branch-name" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "::error::Branch name '$BRANCH' does not match the canonical pattern '<type>/<change-id>'."
            echo "Allowed types: feat, fix, chore, docs, refactor, test, release."
            echo "Change-id must be lowercase kebab-case (e.g. 'add-litellm-enforcement')."
            echo "See docs/development-flow.md §1 and specs/release-management.md §6.5."
            exit 1
          fi

          # Extract change-id and verify openspec/changes/<change-id>/ exists.
          CHANGE_ID="${BRANCH#*/}"
          echo "change_id=$CHANGE_ID" >> "$GITHUB_OUTPUT"

          if [ -d "openspec/changes/$CHANGE_ID" ]; then
            echo "✅ openspec/changes/$CHANGE_ID/ found."
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Special case: chore/* branches (e.g. chore/release-cut, chore/skill-bump)
          # are allowed without an openspec/changes/ directory because they don't
          # represent a feature change — they're maintenance work.
          case "$BRANCH" in
            chore/*)
              echo "Exempt: chore/* branch — no openspec/changes/ required."
              echo "verdict=exempt-chore" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "verdict=fail-no-openspec" >> "$GITHUB_OUTPUT"
          echo "::error::Branch '$BRANCH' decomposes to change-id '$CHANGE_ID', but openspec/changes/$CHANGE_ID/ does not exist."
          echo "Either:"
          echo "  (a) Create the proposal at openspec/changes/$CHANGE_ID/proposal.md and commit it to this branch, OR"
          echo "  (b) Rename the branch to match an existing change-id, OR"
          echo "  (c) If this is genuinely outside the OpenSpec workflow (e.g. a hot-fix), use a chore/* branch."
          exit 1

      - name: Comment violation on PR
        if: always() && (steps.validate.outputs.verdict == 'fail-branch-name' || steps.validate.outputs.verdict == 'fail-no-openspec')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const verdict = '${{ steps.validate.outputs.verdict }}';
            const branch = '${{ steps.validate.outputs.branch_name }}' || '${{ github.event.pull_request.head.ref }}';
            const changeId = '${{ steps.validate.outputs.change_id }}' || '(undetermined)';
            let body;
            if (verdict === 'fail-branch-name') {
              body = [
                '### ⚠️ branch-name-validator: branch name does not match canonical pattern',
                '',
                `**Branch**: \`${branch}\``,
                '**Expected**: `<type>/<change-id>` where `<type>` ∈ {feat, fix, chore, docs, refactor, test, release} and `<change-id>` is lowercase kebab-case.',
                '',
                'Examples that pass:',
                '- `feat/add-litellm-enforcement`',
                '- `fix/v0.9.1-followups`',
                '- `chore/release-cut`',
                '',
                'See [docs/development-flow.md §1](../blob/main/docs/development-flow.md) for the canonical hierarchy.',
                '',
                '**To fix**: rename the branch (`git branch -m <new-name>`) and force-push, or close this PR and re-open from a properly-named branch.',
              ].join('\n');
            } else {
              body = [
                '### ⚠️ branch-name-validator: branch references unknown OpenSpec change',
                '',
                `**Branch**: \`${branch}\``,
                `**Expected directory**: \`openspec/changes/${changeId}/\``,
                '',
                'The branch name decomposes to a change-id that does not have a corresponding OpenSpec proposal directory in this PR.',
                '',
                'Three ways to fix:',
                `1. Create the proposal at \`openspec/changes/${changeId}/proposal.md\` and commit it to this branch (recommended).`,
                '2. Rename the branch to match an existing change-id under `openspec/changes/`.',
                '3. If this is a genuine hot-fix outside the OpenSpec workflow, rename the branch to `chore/<short-id>` (chore branches are exempt from the OpenSpec directory requirement).',
                '',
                'See [docs/development-flow.md §3.1](../blob/main/docs/development-flow.md) for the trivial-fix vs OpenSpec decision rule.',
              ].join('\n');
            }
            // Find the previous comment by this bot to update it (sticky comment).
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.startsWith('### ⚠️ branch-name-validator')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
