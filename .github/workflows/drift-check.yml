# drift-check.yml — weekly circuit-breaker.
#
# This workflow runs `python -m scripts.drift_check --check all` on a weekly
# cadence to catch drift the pre-commit hook (which only sees staged files)
# cannot see: consumer `inherits_from` pins, broken cross-references inside
# `specs/*.md`, taxonomy drift across the documentation tree, and any
# auto-managed section a human forgot to regenerate.
#
# 48-hour stagger rationale
# -------------------------
# The T18a LangGraph DriftDetector (not owned by this repo) runs continuously
# and may already surface drift into its own notification channel. If the
# DriftDetector is live and healthy we do NOT want a second, lower-signal
# weekly report piling into the same feed — but if the DriftDetector goes
# silent (crashed worker, expired secret, removed integration) we ALSO do not
# want to go blind. The compromise is the sentinel file
# ``.ai-playbook/heartbeat-t18a.txt``: the DriftDetector touches it after
# every successful run. If the sentinel is fresh (mtime < 24h ago) this
# workflow skips. If the sentinel is stale or absent this workflow runs,
# surfacing drift as a `::warning::` annotation so operators see the same
# information a working DriftDetector would have emitted.
#
# The 48-hour window in the spec refers to the post-T18a bootstrap period:
# for the first 48h after T18a goes live the DriftDetector itself carries the
# signal; once it has been healthy long enough to be trusted the sentinel
# stays fresh and this workflow naturally stays quiet. When T18a is down, the
# sentinel ages out within a day and the weekly job fills the gap.

name: drift-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * MON"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check T18a heartbeat sentinel
        id: heartbeat
        run: |
          # Skip when the T18a DriftDetector has written the sentinel within
          # the last 24h — its signal is richer and we do not want duplicate
          # alerts. Absence or staleness (>24h) falls through and runs the job.
          if [ -f .ai-playbook/heartbeat-t18a.txt ]; then
            last=$(stat -c %Y .ai-playbook/heartbeat-t18a.txt 2>/dev/null || stat -f %m .ai-playbook/heartbeat-t18a.txt)
            now=$(date +%s)
            age=$(( now - last ))
            if [ "$age" -lt 86400 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "T18a heartbeat fresh (age=${age}s) — skipping weekly drift check."
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.heartbeat.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        if: steps.heartbeat.outputs.skip != 'true'
        run: pip install -e ".[dev]"

      - name: Run drift check
        if: steps.heartbeat.outputs.skip != 'true'
        run: python -m scripts.drift_check --check all

      - name: Notify on drift (placeholder)
        if: failure() && steps.heartbeat.outputs.skip != 'true'
        run: |
          echo "::warning::Drift detected; open an issue or run python -m scripts.drift_check --fix"
