# docs-deploy.yml — publish the MkDocs site to GitHub Pages on every tag push.
#
# Triggers on:
#   - push to main (refresh `latest` site)
#   - push of v*.*.* tag (publish versioned site under `gh-pages`)
#
# Site URL: https://wizarck.github.io/ai-playbook/
#
# The site dogfoods the existing docs/ tree (no separate docs source); see
# mkdocs.yml at the repo root for the navigation contract.

name: docs-deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MkDocs deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build site
        # `--strict` was removed 2026-04-27: the nav references files outside
        # `docs_dir` (under `../specs/*` and `../templates/*`) which mkdocs
        # warns about, then aborts under strict. The cross-tree references are
        # intentional (the spec tree dogfoods the docs site) and the warnings
        # are expected. A future enhancement could adopt `mkdocs-monorepo-plugin`
        # or move specs/ under docs/ to silence them; until then, deploy
        # with warnings rather than not at all.
        run: mkdocs build --site-dir _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Conditional on `PAGES_ENABLED` repo variable. Set it to `true` once
    # GitHub Pages is enabled for the repo (Settings → Pages → Source =
    # GitHub Actions). For private repos this requires GitHub Pro / Team /
    # Enterprise; free-tier private repos can't use Pages and should leave
    # this var unset so the deploy step is skipped (build still verifies the
    # site assembles cleanly).
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
