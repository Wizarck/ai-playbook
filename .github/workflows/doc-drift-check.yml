# doc-drift-check.yml
#
# CI gate: enforce that paired (code, doc) tuples move together in a PR.
# See specs/doc-drift-enforcement.md (v1.0.0) for the full contract.
#
# Triggers on PR open / synchronize / reopen / edited. The `edited` trigger is
# essential — when an author adds `[no-doc-impact]` to the PR title to bypass
# the gate, no code push is required to re-run the check.
#
# Outputs:
# - Hard check failure on Tier 1 drift (exit 1).
# - Sticky PR comment with the offending pair(s) and the suggested fix.
# - Schema break (exit 2) also fails the check; sticky comment points at the
#   manifest.

name: doc-drift-check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for the sticky comment

    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          # Need full history so `git diff origin/main...HEAD` resolves.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (PyYAML only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Ensure origin/main is fetched
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=0 || git fetch origin main

      - name: Run doc-drift check
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          python scripts/check_doc_drift.py \
            --pr-title "$PR_TITLE" \
            --base-ref origin/main \
            --head-ref HEAD \
            2> drift-stderr.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo 'stderr<<EOF'
            cat drift-stderr.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ $rc -ne 0 ]; then
            cat drift-stderr.txt 1>&2
          fi
          exit 0    # never bail the workflow before the sticky-comment step

      - name: Update sticky PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const rc = parseInt('${{ steps.check.outputs.rc }}', 10);
            const stderr = `${{ steps.check.outputs.stderr }}`;
            const header = '### 🧷 doc-drift-check';
            let body;
            if (rc === 0) {
              body = [
                header,
                '',
                '✅ Pass — no Tier 1 doc-drift detected on this PR.',
                '',
                '_Contract_: [`specs/doc-drift-enforcement.md`](../blob/main/specs/doc-drift-enforcement.md). ' +
                '_Pairs_: [`specs/co-edit-pairs.yaml`](../blob/main/specs/co-edit-pairs.yaml).',
              ].join('\n');
            } else if (rc === 1) {
              body = [
                header,
                '',
                '❌ **Doc-drift detected** — one or more paired files were modified without their counterpart.',
                '',
                '```',
                stderr || '(no stderr captured)',
                '```',
                '',
                '**To fix**:',
                '1. Edit the missing side in this PR, OR',
                '2. Add `[no-doc-impact]` (case-insensitive) anywhere in the PR title if this change truly does not affect the doc contract.',
                '',
                '_Contract_: [`specs/doc-drift-enforcement.md`](../blob/main/specs/doc-drift-enforcement.md) §5 (escape hatch).',
              ].join('\n');
            } else {
              body = [
                header,
                '',
                '🛑 **Schema error** — `specs/co-edit-pairs.yaml` (or `scripts/check_doc_drift.py`) failed before drift detection.',
                '',
                '```',
                stderr || '(no stderr captured)',
                '```',
                '',
                '_Contract_: [`specs/doc-drift-enforcement.md`](../blob/main/specs/doc-drift-enforcement.md) §2 (manifest schema).',
              ].join('\n');
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.startsWith(header)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail the check on drift
        if: steps.check.outputs.rc != '0'
        run: |
          echo "doc-drift-check failed with exit code ${{ steps.check.outputs.rc }}."
          exit 1
