name: validate-pairing.rule
on:
  pull_request:
    paths:
      - "docs/rules/**"
      - "scripts/rules/**"
      - "AGENTS.md"
      - "schemas/schema-rule-v1.json"
      - ".github/workflows/validate-pairing.rule.yml"

permissions:
  contents: read

jobs:
  validate-pairing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pyyaml
      - name: Run pairing validator
        run: python -m scripts.validate_pairing
      - name: Run parallel shell oracle (D12 tripwire)
        run: bash scripts/validate_pairing_oracle.sh
