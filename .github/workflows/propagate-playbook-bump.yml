# propagate-playbook-bump.yml — zero-touch propagation of a new playbook tag
# to every consumer listed in `consumers.yaml`.
#
# Fires when a semver tag is pushed. For each active consumer:
#   1. Clones the consumer repo.
#   2. Updates the `.ai-playbook/` submodule pointer to the new tag.
#   3. Pushes a branch `chore/bump-playbook-<tag>`.
#   4. Opens a PR against the consumer's default branch.
#
# Humans review + merge the PRs — propagation is propose-only per the
# propose-only HITL convention documented in `docs/concepts/upstream-sync.md`.
#
# Required repo secret:
#   - PLAYBOOK_PROPAGATION_TOKEN: a PAT (or fine-grained token) with
#     `contents:write` + `pull-requests:write` scopes on every consumer
#     repo listed in consumers.yaml. Kept in SOPS; mirrored to repo
#     secrets. Rotation policy per docs/concepts/data-retention.md.
#
# Notifications:
#   - Each PR opened emits a `warn` notification via scripts/notify.py
#     (dashboard bell + optional SMTP).
#   - Failures emit `error` notifications and attach logs as artifact.

name: propagate-playbook-bump

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only reads this repo; writes happen via gh w/ PAT
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need tags for version resolution
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install playbook deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Derive tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Propagate to every active consumer
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_PROPAGATION_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AIPLAYBOOK_NOTIFICATIONS_TO: ${{ secrets.AIPLAYBOOK_NOTIFICATIONS_TO }}
        run: |
          python -m scripts.propagate_bump \
              --tag "${{ steps.tag.outputs.tag }}" \
              --consumers consumers.yaml \
              --open-pr \
              --notify

      - name: Upload notifications log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-propagate-${{ steps.tag.outputs.tag }}
          path: .ai-playbook/notifications.jsonl
          if-no-files-found: ignore
