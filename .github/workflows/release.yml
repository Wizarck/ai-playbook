# release.yml — publish a GitHub Release when a semver tag is pushed.
#
# On every `v*.*.*` tag push, run scripts/release_cut: it resolves the tag,
# extracts that version's CHANGELOG.md section, collects the OpenSpec changes
# archived since the previous tag, and creates the GitHub Release with those
# notes (on private repos it also syncs a Jira fixVersion — a no-op here).
#
# Fallback: if this job ever fails, the manual `gh release create` path in
# docs/runbooks/release.md §5 still works — the tag itself is unaffected.
# Also kept: workflow_dispatch, to re-run release_cut against the latest tag.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write # gh release create

jobs:
  release-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags: previous-tag + CHANGELOG resolution
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.release_cut
