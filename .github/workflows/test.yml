# test.yml — pytest + schema validation.
# Populated in T09 (pre-commit + tests) and T22 (governance).
# v0.1.0: minimal CI job so repo is "green" from day one.

name: test

on:
  push:
    branches: [main, baseline]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest -ra
