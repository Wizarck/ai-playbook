# test.yml — pytest + schema validation.
# Populated in T09 (pre-commit + tests) and T22 (governance).
# v0.1.0: minimal CI job so repo is "green" from day one.

name: test

on:
  push:
    branches: [main, baseline]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest -ra

      - name: Drift detector (warn-only)
        # Change C add-litellm-enforcement T7.8: surface direct-SDK callers and
        # `_llm.call(...)` invocations missing `application=`. Warn-only mode —
        # exit 0 even on findings. Promote to `--strict` after 30 days of green
        # builds (target: 2026-06-05). See verify_llm_routing.py header for the
        # warn → strict ratchet (D3.5).
        run: python -m scripts.verify_llm_routing
