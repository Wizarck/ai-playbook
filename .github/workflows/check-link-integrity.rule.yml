name: check-link-integrity.rule
on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "scripts/check_link_integrity.py"
      - ".github/workflows/check-link-integrity.rule.yml"

permissions:
  contents: read

jobs:
  check-link-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run broken-link detector
        run: python -m scripts.check_link_integrity docs/
