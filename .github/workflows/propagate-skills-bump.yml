# propagate-skills-bump.yml — RFC-0001 Phase 2b.
#
# Zero-touch propagation of a new skills source-repo tag to every consumer
# in `consumers.yaml` that has a matching `skills_pins.<source-repo>` entry.
#
# Two trigger modes:
#
# 1. Tag push to ai-playbook itself (`v*.*.*`). The playbook ships its own
#    skills under `skills/`, so its tags are also skills tags. Source repo
#    is hard-coded `ai-playbook` in this path.
#
# 2. `repository_dispatch` event with `event_type=skills-tag-pushed`. This is
#    the channel `consumer-d-skills` (and any future skills source repo) uses to
#    notify the playbook when ITS tag should propagate. The payload carries
#    `client_payload.source_repo` and `client_payload.tag`.
#
# In both modes, propagation is propose-only per the HITL convention
# documented in `specs/upstream-sync.md`: a PR is opened against each
# consumer; humans review + merge.
#
# Required repo secret:
#   - PLAYBOOK_PROPAGATION_TOKEN: a PAT with `contents:write` +
#     `pull-requests:write` scopes on every consumer repo listed in
#     consumers.yaml. Same secret used by propagate-playbook-bump.yml.
#
# Notifications:
#   - Each PR opened emits a `warn` notification via scripts/notify.py.
#   - Failures emit `error` notifications and attach logs as artifact.

name: propagate-skills-bump

on:
  push:
    tags:
      - "v*.*.*"
  repository_dispatch:
    types: [skills-tag-pushed]

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only reads this repo; writes happen via gh w/ PAT
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install playbook deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve source repo + tag
        id: src
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "source_repo=${{ github.event.client_payload.source_repo }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "source_repo=ai-playbook" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Propagate to every active consumer
        env:
          GH_TOKEN: ${{ secrets.PLAYBOOK_PROPAGATION_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AIPLAYBOOK_NOTIFICATIONS_TO: ${{ secrets.AIPLAYBOOK_NOTIFICATIONS_TO }}
        run: |
          python -m scripts.propagate_skills_bump \
              --source-repo "${{ steps.src.outputs.source_repo }}" \
              --tag "${{ steps.src.outputs.tag }}" \
              --consumers consumers.yaml \
              --open-pr \
              --notify

      - name: Upload notifications log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-skills-${{ steps.src.outputs.source_repo }}-${{ steps.src.outputs.tag }}
          path: .ai-playbook/notifications.jsonl
          if-no-files-found: ignore
