name: check-rule-schemas.rule
on:
  pull_request:
    paths:
      - "docs/rules/**/*.rule.md"
      - "docs/concepts/**/*.md"
      - "schemas/schema-rule-v1.json"
      - "schemas/schema-concept-v1.json"
      - "scripts/rules/**"
      - ".github/workflows/**/*.rule.yml"
      - "config-ui/*-inventory.json"
      - "config-ui/defaults.json"
      - "config-ui/*.js"
      - "scripts/build_ui_sidecars.py"
      - "templates/new-project/.claude/settings.json.tmpl"
      - ".github/workflows/check-rule-schemas.rule.yml"

permissions:
  contents: read

jobs:
  check-rule-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . jsonschema pyyaml
      - name: Validate docs/rules/*.rule.md against schema-rule-v1.json
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          import jsonschema

          schema = json.loads(Path("schemas/schema-rule-v1.json").read_text(encoding="utf-8"))
          errors = []
          for md in Path("docs/rules").glob("*.rule.md"):
              text = md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  # Slice 4: legacy rules ship without frontmatter; Slice 5
                  # backfills. Skip until then.
                  print(f"SKIP (no frontmatter, Slice 5 backfills): {md}")
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  errors.append(f"{md}: unterminated frontmatter")
                  continue
              try:
                  fm = yaml.safe_load(text[3:end])
              except yaml.YAMLError as exc:
                  errors.append(f"{md}: {exc}")
                  continue
              if not isinstance(fm, dict) or fm.get("schema") != "rule/v1":
                  # Same lenience: only validate rules that already carry the
                  # `schema: rule/v1` frontmatter contract.
                  continue
              try:
                  jsonschema.validate(fm, schema)
              except jsonschema.ValidationError as exc:
                  errors.append(f"{md}: {exc.message}")
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(2)
          print("rule-schema: OK")
          PY
      - name: Validate docs/concepts/*.md against schema-concept-v1.json
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          import jsonschema

          schema = json.loads(Path("schemas/schema-concept-v1.json").read_text(encoding="utf-8"))
          errors = []
          for md in Path("docs/concepts").glob("*.md"):
              # INDEX.md is auto-generated and may have a different shape.
              if md.name == "INDEX.md":
                  continue
              text = md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  # Slice 4 placeholder docs have frontmatter; legacy moved
                  # concept docs may not yet — they get frontmatter in Slice 5.
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  continue
              try:
                  fm = yaml.safe_load(text[3:end])
              except yaml.YAMLError as exc:
                  errors.append(f"{md}: {exc}")
                  continue
              if not isinstance(fm, dict):
                  continue
              if "schema" not in fm or fm.get("schema") != "concept/v1":
                  # Slice 4: legacy concept docs lack schema field — skip
                  # until Slice 5 backfills.
                  continue
              try:
                  jsonschema.validate(fm, schema)
              except jsonschema.ValidationError as exc:
                  errors.append(f"{md}: {exc.message}")
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(2)
          print("concept-schema: OK")
          PY
      - name: Rules inventory is fresh + no dangling hooks
        run: python -m scripts.rules_toggle inventory --check
      - name: config-ui .js sidecars match their .json
        run: python -m scripts.build_ui_sidecars --check
