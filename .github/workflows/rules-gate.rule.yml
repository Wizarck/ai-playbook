# Single always-on gate for the cheap repo-hygiene checks.
#
# WHY THIS EXISTS. These checks used to live in five separate workflows, each
# with its own `paths:` filter. That made them unrequireable: a required status
# check whose workflow is paths-filtered never reports on a PR that misses the
# filter, and GitHub blocks such a PR forever waiting for a check that will not
# come. So the branch ruleset could require none of them, and the only enforced
# gate was pytest.
#
# One job rather than five jobs plus an aggregator: the job name IS the stable
# context, so there is no aggregation logic to get wrong, and no second place
# where a renamed job silently drops out of the gate. Every step carries
# `if: ${{ !cancelled() }}` so one failure still reports the rest — a gate that
# stops at the first error makes you pay a full round trip per finding.
#
# Cost is ~40s on one hosted runner per PR. The five filtered workflows were
# 15-21s each, so on a PR touching docs and rules this is roughly a wash.
name: rules-gate.rule

on:
  pull_request:

permissions:
  contents: read

jobs:
  rules-gate:
    name: rules-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Union of what the five workflows each installed separately.
      - name: Install
        run: pip install -e . jsonschema pyyaml langdetect

      - name: Broken-link detector
        if: ${{ !cancelled() }}
        run: python -m scripts.check_link_integrity docs/

      - name: ENGLISH-only docs lint
        if: ${{ !cancelled() }}
        run: python -m scripts.check_doc_language docs/

      - name: AGENTS.md size (D14, ≤500 lines)
        if: ${{ !cancelled() }}
        run: python -m scripts.check_agents_md_size

      - name: Rule/hardrule pairing
        if: ${{ !cancelled() }}
        run: python -m scripts.validate_pairing

      - name: Pairing shell oracle (D12 tripwire)
        if: ${{ !cancelled() }}
        run: bash scripts/validate_pairing_oracle.sh

      - name: Validate docs/rules/*.rule.md against schema-rule-v1.json
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          import jsonschema

          schema = json.loads(Path("schemas/schema-rule-v1.json").read_text(encoding="utf-8"))
          errors = []
          for md in Path("docs/rules").glob("*.rule.md"):
              text = md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  # Slice 4: legacy rules ship without frontmatter; Slice 5
                  # backfills. Skip until then.
                  print(f"SKIP (no frontmatter, Slice 5 backfills): {md}")
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  errors.append(f"{md}: unterminated frontmatter")
                  continue
              try:
                  fm = yaml.safe_load(text[3:end])
              except yaml.YAMLError as exc:
                  errors.append(f"{md}: {exc}")
                  continue
              if not isinstance(fm, dict) or fm.get("schema") != "rule/v1":
                  # Same lenience: only validate rules that already carry the
                  # `schema: rule/v1` frontmatter contract.
                  continue
              try:
                  jsonschema.validate(fm, schema)
              except jsonschema.ValidationError as exc:
                  errors.append(f"{md}: {exc.message}")
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(2)
          print("rule-schema: OK")
          PY

      - name: Validate docs/concepts/*.md against schema-concept-v1.json
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          import yaml
          import jsonschema

          schema = json.loads(Path("schemas/schema-concept-v1.json").read_text(encoding="utf-8"))
          errors = []
          for md in Path("docs/concepts").glob("*.md"):
              # INDEX.md is auto-generated and may have a different shape.
              if md.name == "INDEX.md":
                  continue
              text = md.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  # Slice 4 placeholder docs have frontmatter; legacy moved
                  # concept docs may not yet — they get frontmatter in Slice 5.
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  continue
              try:
                  fm = yaml.safe_load(text[3:end])
              except yaml.YAMLError as exc:
                  errors.append(f"{md}: {exc}")
                  continue
              if not isinstance(fm, dict):
                  continue
              if "schema" not in fm or fm.get("schema") != "concept/v1":
                  # Slice 4: legacy concept docs lack schema field — skip
                  # until Slice 5 backfills.
                  continue
              try:
                  jsonschema.validate(fm, schema)
              except jsonschema.ValidationError as exc:
                  errors.append(f"{md}: {exc.message}")
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(2)
          print("concept-schema: OK")
          PY

      - name: Rules inventory is fresh + no dangling hooks
        if: ${{ !cancelled() }}
        run: python -m scripts.rules_toggle inventory --check

      - name: config-ui .js sidecars match their .json
        if: ${{ !cancelled() }}
        run: python -m scripts.build_ui_sidecars --check
