name: apply-skill-enforcement.rule

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-apply-marker:
    name: validate apply markers on PR diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history to diff vs the PR base

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Check rule toggle (skip validation if L3 OFF)
        id: toggle
        run: |
          python -m scripts.rules_toggle status \
            --slug apply-skill-enforcement \
            --layer L3 \
            --exit-code
        continue-on-error: true

      - name: Validate
        if: steps.toggle.outcome == 'success'
        # Invoked by PATH, not `python -m`: the `.rule.py` filename's kebab-case
        # slug is not an importable module name (`scripts.rules.apply-skill-enforcement`
        # → No module named …). Matches the script's own docstring usage.
        run: |
          python scripts/rules/apply-skill-enforcement.rule.py validate-pr-diff \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Note skipped validation (if applicable)
        if: steps.toggle.outcome == 'failure'
        run: |
          echo "::notice title=apply-skill-enforcement skipped::The L3 layer of apply-skill-enforcement is disabled in this repo's .ai-playbook/rules-toggle.json. Validation step skipped."
