name: apply-skill-enforcement.rule

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-apply-marker:
    name: validate apply markers on PR diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to diff vs the PR base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Validate
        run: |
          python -m scripts.rules.apply-skill-enforcement validate-pr-diff \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
