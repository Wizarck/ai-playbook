[project]
name = "ai-playbook"
version = "0.1.0"
description = "Universal AI-dev norms, specs, scripts, and templates for Wizarck org projects"
requires-python = ">=3.11"
authors = [
    { name = "Arturo Ramírez", email = "arturo6ramirez@gmail.com" },
]
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ruff>=0.4",
]
tracing = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "langfuse>=2.40",
]
injection = [
    "anthropic>=0.30",
]

[project.scripts]
ai-playbook-doctor = "scripts.doctor:main"
ai-playbook-bootstrap = "scripts.bootstrap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
