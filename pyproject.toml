[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only package the importable Python trees. The .ai-playbook layout (v0.18.0):
#   scripts/          — top-level tooling (validators, generators, dispatcher)
#   scripts/rules/    — L1 hook implementations (subpackage)
#   scripts/mcp/      — MCP subsystem
#   scripts/tracing/  — OTel subsystem
# Markdown, YAML, JSON, schema and template trees are not Python packages.
include = ["scripts*"]
exclude = ["specs*", "routers*", "templates*", "docs*", "tests*", "schemas*", "openspec*", "skills*", "configs*"]

[project]
name = "ai-playbook"
version = "0.2.1"
description = "Universal AI-dev norms, specs, scripts, and templates for Wizarck org projects"
requires-python = ">=3.11"
authors = [
    { name = "Arturo Ramírez", email = "23051550+Wizarck@users.noreply.github.com" },
]
readme = "README.md"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "ruff>=0.4",
]
tracing = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "langfuse>=2.40",
]
injection = [
    "anthropic>=0.30",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
ai-playbook-doctor = "scripts.doctor:main"
ai-playbook-bootstrap = "scripts.bootstrap:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
# 120 chars is the modern convention (Black default = 88, ruff/PEP-suggested 100,
# practical team default 120). Bumped from 100 in the RFC-0001 ruff cleanup —
# 55 of 66 outstanding E501 violations were 101-120 chars, an artificial cliff.
# Lines >120 stay flagged; break them or extract to intermediate variables.
line-length = 120
target-version = "py311"
extend-exclude = [
    # Skills tree (RFC-0001) is content + assets, not playbook code.
    # Some assets are templates with placeholder syntax that trip lint.
    "skills",
    # Slice 4 paired hooks under scripts/rules/ use the `.rule.py` filename
    # convention (D5). The kebab-case slug in the filename violates PEP 8
    # module naming (N999), but these files are invoked via subprocess
    # (D2 — scripts not imported), so the naming is intentional.
    "scripts/rules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# SIM105 (use contextlib.suppress) would mass-rewrite a try-except-pass
# pattern that's consistent across the playbook (skills_registry.py,
# _break_glass.py, etc.). Keeping the explicit form for stylistic
# consistency until a dedicated cleanup PR addresses it.
ignore = ["SIM105"]
